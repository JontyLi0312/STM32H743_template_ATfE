# Main OpenOCD Configuration File for STM32H743IIT6 Project

# 1. Specify the debug probe interface.
# Uncomment the one you are using.
# source [find interface/stlink.cfg]
source [find interface/cmsis-dap.cfg]
# source [find interface/jlink.cfg]

# 2. Set the transport protocol.
transport select swd

# 3. Specify the target MCU. This file provides the base definitions
# for the STM32H7 series, including memory map and register addresses.
source [find target/stm32h7x.cfg]

# 4. Source our custom script for QSPI initialization.
# This script will be automatically executed on the 'reset-init' event.
source [find .conf/stm32h743_qspi.cfg]

# Optional: Reduce adapter speed for initial connection if stability issues occur.
# adapter speed 1800

# -----------------------------------------------------------------------------
# 5. CRITICAL: Declare the external QSPI flash bank to OpenOCD's driver.
#    This command tells OpenOCD how to handle the 0x90000000 address space.
# -----------------------------------------------------------------------------
# flash bank <name> <driver> <base> <size> <chip_width> <bus_width> <target>
flash bank qspi_flash stmqspi 0x90000000 0x00800000 0 0 $_CHIPNAME.cpu0