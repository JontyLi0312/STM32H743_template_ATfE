#.conf/stm32h743_qspi.cfg
#
# Version 5: Final Correction.
# - Corrected the value for the RCC_D1CFGR register to accurately set the
#   HPRE (AHB) and D1PPRE (APB3) bus prescalers, resolving the target
#   timeout issue. All other verified settings from previous versions
#   are retained.

# Specify the debugger interface.
adapter driver cmsis-dap

# Specify the transport protocol.
transport select swd

# Set the target chip name.
set CHIPNAME STM32H743IIT6

# Load the base configuration for the STM32H7 series.
source [find target/stm32h7x.cfg]

# Configure the reset behavior.
reset_config srst_only

#
# qspi_init procedure: Initializes the QSPI peripheral and its GPIOs.
#
proc qspi_init {} {
    # --- Step 1: Enable peripheral clocks ---
    mmw 0x580244E0 0x0000001A 0 ;# RCC_AHB4ENR: Enable GPIOB, GPIOD, GPIOE
    mmw 0x580244D4 0x00004000 0 ;# RCC_AHB3ENR: Enable QSPIEN
    sleep 10

    # --- Step 2: Configure GPIO pins for QSPI Alternate Function ---
    # Matched to your quadspi.c: PB2, PB6, PD11, PD12, PD13, PE2
    # Configure GPIOB (PB2 for CLK, PB6 for NCS)
    mmw 0x58020400 0x00002020 0x00001010
    mmw 0x58020408 0x00003030 0
    mmw 0x5802040C 0 0x00003030
    mmw 0x58020420 0x0A000900 0x05000600

    # Configure GPIOD (PD11, PD12, PD13 for IO0, IO1, IO3)
    mmw 0x58020C00 0x0E800000 0x0A400000
    mmw 0x58020C08 0x0FC00000 0
    mmw 0x58020C0C 0 0x0FC00000
    mmw 0x58020C24 0x00999000 0x00666000

    # Configure GPIOE (PE2 for IO2)
    mmw 0x58021000 0x00000020 0x00000010
    mmw 0x58021008 0x00000030 0
    mmw 0x580210C0 0 0x00000030
    mmw 0x58021020 0x00000900 0x00000600

    # --- Step 3: Configure the QUADSPI controller ---
    mww 0x52005000 0x01000F10 ;# QUADSPI_CR: PRESCALER=1 (QSPI clk = 240/2=120MHz)
    mww 0x52005004 0x00160100 ;# QUADSPI_DCR: FSIZE=0x16 (8MB), CKMODE=0, CSHT=1
    
    # --- Step 4: Configure Memory-Mapped Mode ---
    # FMODE=Mem-map, DMODE=Quad, DCYC=8, ADSIZE=24b, ADMODE=Single, IMODE=Single, INSTR=0xEB
    mww 0x52005014 0x3D2205EB

    # --- Step 5: Enable the QSPI peripheral ---
    mmw 0x52005000 0x00000001 0 ;# QUADSPI_CR: Set EN bit

    # --- Step 6: Define the external flash memory bank for OpenOCD ---
    flash bank stm32h7x_quadspi $_CHIPNAME.cpu0 0x90000000 0x800000 0 0 0
}

#
# 'reset-init' event handler: Executed by OpenOCD immediately after CPU reset.
#
$_CHIPNAME.cpu0 configure -event reset-init {
    adapter speed 2000

    # --- Step 1: Configure Flash Access Latency ---
    mmw 0x52002000 0x00000024 0x0000001B ;# FLASH_ACR: LATENCY=4, WRHIGHFREQ=2

    # --- Step 2: Configure Power and Voltage Scaling ---
    mww 0x5802480C 0x0000C000 ;# PWR_D3CR: Set VOS0 for 480MHz operation
    wait_until { [mrw 0x58024800] & 0x00002000 } 2000 ;# Wait for VOSRDY

    # --- Step 3: Configure the Main Clock Tree (from 25MHz HSE) ---
    mmw 0x58024400 0x00010000 0 ;# RCC_CR: Enable HSE
    wait_until { [mrw 0x58024400] & 0x00020000 } 2000 ;# Wait for HSERDY

    # Configure PLLs source and dividers.
    mww 0x58024428 0x02050000 ;# RCC_PLLCKSELR: PLLSRC=HSE, DIVM1=5
    mww 0x58024430 0x0103017F ;# RCC_PLL1DIVR: N=192, P=2, Q=4 -> SYSCLK=480MHz
    mww 0x5802442C 0x00030200 ;# RCC_PLLCFGR: Enable PLL P/Q outputs, set range

    # Enable PLL1 and wait for it to lock.
    mmw 0x58024400 0x01000000 0 ;# RCC_CR: Enable PLL1
    wait_until { [mrw 0x58024400] & 0x02000000 } 2000 ;# Wait for PLL1RDY

    # Configure domain clock prescalers (values verified against your C code).
    # **FINAL FIX**: Corrected RCC_D1CFGR value.
    mww 0x58024418 0x00000408  ;# RCC_D1CFGR: HPRE=/2 (AHB=240MHz), D1PPRE=/2
    mww 0x5802441C 0x00000440  ;# RCC_D2CFGR: D2PPRE1=/2, D2PPRE2=/2
    mww 0x58024420 0x00000040  ;# RCC_D3CFGR: D3PPRE=/2

    # Switch the system clock source to PLL1.
    mmw 0x58024410 0x00000003 0 ;# RCC_CFGR: Switch SW to PLL1
    wait_until { ([mrw 0x58024410] & 0x00000018) == 0x18 } 2000 ;# Wait for switch

    # --- Step 4: Initialize QSPI peripheral ---
    qspi_init

    # Increase adapter speed for fast programming.
    adapter speed 8000
}