# This is a FK750M5-XBH6 with a single STM32H750XBH6 chip.
# Board：FK750M4-XBH6、FK750M5-XBH6、FK750M6-XBH6（32bit-SDRAM）
# ##Supports ARMFLY STM32-V7 board STM32H743/STM32H750 (not tested)
# Purchase Store: https://shop212360197.taobao.com/
# QQ group：536665479
# Author: Peakors

# This is for using the STLINK
# source [find interface/stlink.cfg]

# This is for using the DAPLINK
adapter driver cmsis-dap

# Select SWD transport protocol
transport select swd

# Define target chip name variable
set CHIPNAME STM32H743IIT6

# Set flag to enable Quad-SPI controller (1 = enabled, 0 = disable)
set QUADSPI 1

# Ensure Quad-SPI variable exists (compatibility safeguard)
if {![info exists QUADSPI]} {
    set QUADSPI 1
}

# Load OpenOCD STM32H7 series common configuration
source [find target/stm32h7x.cfg]

# Reset configuration
reset_config srst_only

# QUAD-SPI initialization(a function)
proc qspi_init { qpi } {
    global a
    
    # Enable GPIOB/D/E clocks (AHB4 bus)
    mmw 0x580244E0 0x0000001A 0             ; # RCC_AHB4ENR |= GPIOB, D, E enable
    
    # Enable Quad-SPI peripheral clock (AHB3 bus)
    mmw 0x580244D4 0x00004000 0             ; # RCC_AHB3ENR |= QSPIEN (enable clock)
    
    # Wait for clock stabilization
    sleep 1                                ;# Wait for clock startup

    # Configure GPIOB alternate functions (QSPI pins)
	# Port B: PB02:AF09:VH, PB06:AF10:VH
    mmw 0x58020400 0x00002020 0x00001010    ; # MODER: Set PB2 as alternate function
    mmw 0x58020404 0x00000000 0x00000044    ; # OTYPER: PP
    mmw 0x58020408 0x00003030 0x00000000    ; # OSPEEDR: Set very high speed
    mmw 0x5802040C 0x00000000 0x00003030    ; # PUPDR: No Pull-up, Pull-down
    mmw 0x58020420 0x0A000900 0x05000600    ; # AFRL: Configure PB2, PB06 alternate functions

	# Configure GPIOD alternate functions (QSPI pins)
	# Port D: PD11:AF09:VH, PD12:AF10:VH, PD13:AF9:VH
    mmw 0x58020C00 0x0A800000 0x05400000    ; # MODER: Set PD11-PD13 as alternate function
    mmw 0x58020C04 0x00000000 0x00003800    ; # OTYPER: PP
    mmw 0x58020C08 0x0FC00000 0x00000000    ; # OSPEEDR: Set very high speed
    mmw 0x58020C0C 0x00000000 0x0FC00000    ; # PUPDR: No Pull-up, Pull-down
    mmw 0x58020C24 0x00999000 0x00666000    ; # AFRH: Configure PF8-PF15 alternate functions
	
	# Configure GPIOE alternate function (QSPI pins)
	# Port E: PE02:AF09:VH
    mmw 0x58021000 0x00000020 0x00000010    ; # MODER: Set PE02 as alternate function
    mmw 0x58021004 0x00000000 0x00000040    ; # OTYPER: PP
    mmw 0x58021008 0x00000030 0x00000000    ; # OSPEEDR: Set very high speed
    mmw 0x5802100C 0x00000000 0x00000030    ; # PUPDR: No Pull-up, Pull-down
    mmw 0x58021020 0x00000900 0x00000600    ; # AFRL: Configure PE02 alternate function

    # Configure Quad-SPI controller parameters
    mww 0x52005000 0x00001F10 0xFF000000    ;
        # QUADSPI_CR:
        # hqspi.Init.ClockPrescaler = 1
        # hqspi.Init.FifoThreshold = 32
        # hqspi.Init.SampleShifting = QSPI_SAMPLE_SHIFTING_HALFCYCLE
    mww 0x52005004 0x00160001 0x00090700    ;
        # QUADSPI_DCR:
        # hqspi.Init.FlashSize = 22
        # hqspi.Init.ChipSeLectHighTime = QSPI_CS_HIGH_TIME_1_CYCLE
        # hqspi.Init.ClockMode = QSPI_CLOCK_MODE_3
        # hqspi.Init.FLashID = QSPI_FLASH_ID_1
        # hqspi.Init.DualFLash = QSPI_DUALFLASH_DISABLE
    mmw 0x52005000 0x00000001 0x000000000    ;
        # QUADSPI_CR: Enable controller (EN=1)
    
    # Configure memory-mapped mode
    mww 0x52005014 0x03180DEB 0xD024C203      ;
        # QUADSPI_CCR:
        # s_command.InstructionMode   = QSPI_INSTRUCTION_1_LINE;   // 1线指令模式
        # s_command.AddressSize       = QSPI_ADDRESS_24_BITS;      // 24位地址
        # s_command.AlternateByteMode = QSPI_ALTERNATE_BYTES_NONE; // 无交替字节
        # s_command.DdrMode           = QSPI_DDR_MODE_DISABLE;     // 禁止DDR模式
        # s_command.DdrHoldHalfCycle =
        #     QSPI_DDR_HHC_ANALOG_DELAY; // DDR模式中数据延迟，这里用不到
        # s_command.SIOOMode    = QSPI_SIOO_INST_EVERY_CMD; // 每次传输数据都发送指令
        # s_command.AddressMode = QSPI_ADDRESS_4_LINES;     // 4线地址模式
        # s_command.DataMode    = QSPI_DATA_4_LINES;        // 4线数据模式
        # s_command.DummyCycles = 6;                        // 空周期个数
        # s_command.Instruction =
        #     W25Qxx_CMD_FastReadQuad_IO; // 1-4-4模式下(1线指令4线地址4线数据)，快速读取指令 0xEB

}


# CPU reset initialization event handler
$_CHIPNAME.cpu0 configure -event reset-init {
    global QUADSPI

	# Configure Flash wait states (4 wait states for 192MHz operation)
    mmw 0x52002000 0x00000004 0x0000000B    ;# FLASH_ACR: LATENCY=4
    
    # Clock tree configuration
    mmw 0x58024400 0x00000001 0x00000018    ;
        # RCC_CR:
        # Enable HSI clock (HSION=1), 
        # HSI divider=1 (64MHz output)
    mmw 0x58024410 0x10000000 0xEE000007    ;
        # RCC_CFGR:
        # Select HSI as system clock (SW=0), 
        # MCO2 prescaler=8
    mww 0x58024418 0x00000040               ;
        # RCC_D1CFGR:
        # D1 domain AHB prescaler=1 (no division), 
        # APB3 prescaler=2 (D1PPRE=2)
    mww 0x5802441C 0x00000440               ;
        # RCC_D2CFGR:
        # APB1 prescaler=2 (D2PPRE1=2), 
        # APB2 prescaler=2 (D2PPRE2=2)
    mww 0x58024420 0x00000040               ;
        # RCC_D3CFGR:
        # APB4 prescaler=2 (D3PPRE=2)
    mww 0x58024428 0x00000040               ;
        # RCC_PPLCKSELR:
        # PLL1 source=HSI, 
        # Input divider M1=4 (64MHz / 4 = 16MHz)
    
    # Configure PLL1 parameters
    mmw 0x5802442C 0x0001000C 0x00000002    ;
        # RCC_PLLCFGR:
        # PLL1 input range=8-16MHz (PLL1RGE=01), 
        # PLL1 VCO selection=wide (PLL1VCOSEL=0)
    mww 0x58024430 0x01070217               ;
        # RCC_PLL1DIVR:
        # DIVP1=2, DIVQ=8, DIVR1=2, DIVN1=24
        # PLL1 output frequency = (64MHz / M1) × N1 / P1 = (64/4) × 24 / 2 = 192MHz
    
    # Enable PLL1
    mmw 0x58024400 0x01000000 0             ; # RCC_CR: PLL1ON=1
    sleep 1                                 ; # Wait for PLL lock
    
    # Switch system clock to PLL1
    mmw 0x58024410 0x00000003 0             ; # RCC_CFGR: SW=11 (PLL1 as system clock)
    sleep 1                                 ; # Wait for clock switch completion
    
    # Reduce adapter speed for reliable initialization (24kHz)
    adapter speed 24000
    
    # Initialize Quad-SPI if enabled
    if { $QUADSPI } {
        qspi_init 1
    }
}

if { $QUADSPI } {
    flash bank stm32h7x_quadspi 0 0x90000000 0x800000 0 0 $_CHIPNAME.cpu0
}